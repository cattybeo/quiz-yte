name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build _site (copy static files + cache-bust)
        run: |
          mkdir _site
          cp index.html styles.css app.js data.js _site/
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(styles\.css|app\.js|data\.js)\"#\1=\"\2?v=$V\"#g" _site/index.html
          grep -E "v=$V" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
